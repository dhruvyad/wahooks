# NestJS API Deployment — runs inside the k3s cluster so it can reach WAHA
# pods via their headless Service DNS (waha-0.waha.default.svc.cluster.local).
#
# Pinned to control-plane nodes via nodeAffinity so Redis (on the host at
# the control-plane node's internal IP) is always reachable.
# REDIS_URL uses the Hetzner private IP of the control-plane node (10.0.0.2).
#
# Exposed externally via the api-service NodePort; Caddy on the host proxies
# api.wahooks.com → 127.0.0.1:<nodePort>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wahooks-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wahooks-api
  template:
    metadata:
      labels:
        app: wahooks-api
    spec:
      serviceAccountName: wahooks-api    # grants K8sOrchestrator permissions
      # Pin to control-plane so Redis on the host is accessible at localhost
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: api
          image: ghcr.io/noclick/wahooks-api:latest   # built by deploy-api.yml
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: wahooks-api-secret   # all env vars from /opt/wahooks/.env
          env:
            # Live sessions per worker (~47 MB each): 35 ≈ 1.65 GB steady state under
            # the worker's 3 GiB limit, with headroom for media bursts. Existing
            # waha_workers rows keep their own max_sessions — update them with this.
            - name: WAHA_MAX_SESSIONS
              value: "35"
            # Override Redis to use host network (control-plane node's private IP)
            - name: REDIS_URL
              value: "redis://10.0.0.2:6379"
            - name: ORCHESTRATOR
              value: "k8s"
            - name: K8S_NAMESPACE
              value: "default"
            - name: WAHA_STATEFULSET_NAME
              value: "waha"
            - name: WAHA_HEADLESS_SERVICE
              value: "waha"
            # ── Worker kinds: WAHA pods and gateway boxes (CLAUDE.md "Worker kinds") ──
            # Where new connections go: "waha" or "gateway". A value here wins over the
            # secret, so flip it in this file. "gateway" also lets WAHA scale to zero once
            # no WAHA worker holds a session.
            - name: NEW_CONNECTION_WORKER_KIND
              value: "gateway"
            # Session cap a newly registered gateway row gets (existing rows keep theirs),
            # and the gateway used/capacity at which another box is provisioned.
            - name: GATEWAY_MAX_SESSIONS
              value: "5000"
            - name: GATEWAY_SCALE_UP_AT
              value: "0.8"
            - name: GATEWAY_SERVER_TYPE
              value: "cx23"
            - name: GATEWAY_LOCATION
              value: "fsn1"
            # Postgres pool per box: every box's connections count against the store's
            # max_connections.
            - name: GATEWAY_DB_MAX_CONNS
              value: "4"
            # Secrets and deployment-specific IDs, all optional, from wahooks-api-secret
            # (envFrom injects them too; listed here so the set is visible). Without the
            # required ones (HETZNER_API_TOKEN, GATEWAY_NETWORK_ID, GATEWAY_BINARY_URL,
            # GATEWAY_BINARY_SHA256, GATEWAY_DB_URL) the API creates no gateway box; boxes
            # registered by hand still work. Without EVENTS_SECRET, /api/events/waha stays
            # unauthenticated.
            - name: EVENTS_SECRET
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: EVENTS_SECRET, optional: true }
            - name: HETZNER_API_TOKEN
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: HETZNER_API_TOKEN, optional: true }
            - name: GATEWAY_NETWORK_ID
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: GATEWAY_NETWORK_ID, optional: true }
            - name: GATEWAY_FIREWALL_ID
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: GATEWAY_FIREWALL_ID, optional: true }
            - name: GATEWAY_SSH_KEYS
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: GATEWAY_SSH_KEYS, optional: true }
            - name: GATEWAY_BINARY_URL
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: GATEWAY_BINARY_URL, optional: true }
            - name: GATEWAY_BINARY_SHA256
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: GATEWAY_BINARY_SHA256, optional: true }
            - name: GATEWAY_DB_URL
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: GATEWAY_DB_URL, optional: true }
            - name: GATEWAY_WEBHOOK_RESOLVE
              valueFrom:
                secretKeyRef: { name: wahooks-api-secret, key: GATEWAY_WEBHOOK_RESOLVE, optional: true }
          readinessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
